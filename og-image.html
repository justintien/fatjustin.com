<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, height=630, initial-scale=1.0">
    <title>OG Image Generator</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0d0d0d;
            border: 5px solid #ccff00;
            /* Visible border for screenshot crop */
        }

        h1 {
            font-size: 15rem;
            /* Fixed size for OG image */
        }

        .subtitle {
            font-size: 3rem;
            margin-top: 2rem;
        }

        /* Hide interactive elements */
        .socials,
        .theme-toggle,
        .toast,
        #custom-cursor {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1 style="font-family: 'Anton', sans-serif; color: #fff; line-height: 0.8; text-transform: uppercase;">
                FAT<br>JUSTIN
            </h1>
            <div class="subtitle"
                style="font-family: 'Inter', sans-serif; color: #666; text-transform: uppercase; letter-spacing: 0.5em;">
                <span style="font-weight: 900; color: #ccff00;">IS</span> <span
                    style="text-decoration: line-through;">THIN</span> <span
                    style="font-weight: 900; color: #ccff00;">NOT THIN</span>
            </div>
        </header>
    </div>
</body>

</html>
